<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Karyawan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2f5aff; --primary-soft:#e8edff;
    --danger:#f04438; --success:#17b26a;
    --bg:#eef1f8; --card:#ffffff; --text:#131a2c; --muted:#6b7385; --border:#e7eaf3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(160deg,var(--primary) 0%,#0f235c 100%);min-height:100vh;color:var(--text);}
  h3,h4{font-family:'Plus Jakarta Sans',sans-serif;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card-app{background:var(--card);border-radius:24px;padding:30px 26px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .logo{width:56px;height:56px;border-radius:16px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 14px;}
  .form-label{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
  .form-control{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.92rem;margin-bottom:14px;font-family:inherit;}
  .form-control:focus{outline:none;border-color:var(--primary);}
  select.form-control{background:#fff;}
  .btn{border:none;border-radius:14px;font-weight:700;font-size:.95rem;padding:14px;cursor:pointer;width:100%;font-family:inherit;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);text-decoration:none;display:block;text-align:center;}
  .link-center{display:block;text-align:center;font-size:.82rem;color:var(--muted);text-decoration:none;margin-top:16px;}
  #resultBox,#loadingBox{display:none;text-align:center;padding:40px 0;}
  .result-ico{font-size:3rem;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card-app">

    <div id="formBox">
      <div class="logo">📝</div>
      <h3 style="text-align:center;margin:0 0 4px;font-weight:800;">Pendaftaran Karyawan</h3>
      <p style="text-align:center;color:var(--muted);font-size:.85rem;margin:0 0 22px;">Isi data untuk membuat akun absen</p>

      <label class="form-label">Nama Lengkap</label>
      <input type="text" id="namaInput" class="form-control" placeholder="Nama sesuai identitas">

      <label class="form-label">Departemen / Unit</label>
      <input type="text" id="deptInput" class="form-control" placeholder="Contoh: Rawat Inap, Laboratorium">

      <label class="form-label">Shift</label>
      <select id="shiftInput" class="form-control"><option>Memuat...</option></select>

      <label class="form-label">Buat PIN (min. 4 digit)</label>
      <input type="password" id="pinInput" class="form-control" inputmode="numeric" maxlength="8" placeholder="Untuk login absen nanti">

      <label class="form-label">Konfirmasi PIN</label>
      <input type="password" id="pinKonfirmasi" class="form-control" inputmode="numeric" maxlength="8" placeholder="Ulangi PIN">

      <button class="btn btn-primary" onclick="daftar()">Daftar</button>
      <div id="formMsg" style="color:var(--danger);font-size:.8rem;margin-top:10px;text-align:center;"></div>
      <a href="absen.html" class="link-center">← Kembali ke halaman Absen</a>
      <a href="index.html" class="link-center">Menu Utama</a>
    </div>

    <div id="loadingBox">
      <div class="spinner"></div>
      <p style="margin-top:14px;color:var(--muted);">Mengirim pendaftaran...</p>
    </div>

    <div id="resultBox">
      <div class="result-ico" id="resultIcon"></div>
      <h3 id="resultTitle" style="margin:10px 0 4px;"></h3>
      <p id="resultDetail" style="color:var(--muted);font-size:.88rem;"></p>
      <a href="absen.html" class="btn btn-primary" style="display:block;margin-top:10px;text-decoration:none;box-sizing:border-box;">Ke Halaman Absen</a>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script>
  (async function muatShift() {
    const res = await apiCall('getShiftListPublic');
    var sel = document.getElementById('shiftInput');
    sel.innerHTML = '';
    if (res.success) {
      res.data.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s.id; opt.textContent = s.nama;
        sel.appendChild(opt);
      });
    } else {
      sel.innerHTML = '<option value="">Gagal memuat shift</option>';
    }
  })();

  async function daftar() {
    var nama = document.getElementById('namaInput').value.trim();
    var dept = document.getElementById('deptInput').value.trim();
    var shiftId = document.getElementById('shiftInput').value;
    var pin = document.getElementById('pinInput').value.trim();
    var pinKonfirmasi = document.getElementById('pinKonfirmasi').value.trim();

    if (!nama || !dept || !pin || !pinKonfirmasi) {
      document.getElementById('formMsg').textContent = 'Semua kolom wajib diisi.';
      return;
    }

    document.getElementById('formBox').style.display = 'none';
    document.getElementById('loadingBox').style.display = 'block';

    const res = await apiCall('registerEmployee', { nama: nama, departemen: dept, shiftId: shiftId, pin: pin, pinKonfirmasi: pinKonfirmasi });

    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('resultBox').style.display = 'block';
    if (res.success) {
      document.getElementById('resultIcon').textContent = '✅';
      document.getElementById('resultTitle').textContent = 'Pendaftaran Terkirim';
      document.getElementById('resultDetail').innerHTML = res.message;
    } else {
      document.getElementById('resultIcon').textContent = '❌';
      document.getElementById('resultTitle').textContent = 'Pendaftaran Gagal';
      document.getElementById('resultDetail').textContent = res.message;
    }
  }
</script>
</body>
</html>
